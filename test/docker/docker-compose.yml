# One service per environment the plugin has to work in.
#
# All AlmaLinux, because that is what DirectAdmin servers run. The axes that
# actually change behaviour are the PHP version and the borg version, so the
# three images span both rather than repeating one combination on two distros.
#
# borg 1.1 prunes with --prefix and has no compact command; 1.2 renamed the flag
# to --glob-archives and added compaction. The plugin feature-detects rather than
# assuming, and these images are what check that it detects correctly.

x-common: &common
  volumes:
    # The plugin source, read by the driver and copied to the real plugin path.
    - ../..:/plugin
  working_dir: /plugin
  tmpfs:
    - /run
  command: ["test/run-tests.sh"]

services:
  # PHP 8.1, the oldest version supported, with EPEL 9's borg.
  alma9:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.el
      args:
        EL_VERSION: "9"
        PHP_STREAM: "8.1"
        BORG_SOURCE: epel
    image: directadmin-borg-plugin-test:alma9

  # AlmaLinux 8, still widely deployed, and the only place borg 1.1 is still
  # shipped -- which is what covers the older pruning branch for real.
  alma8:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.el
      args:
        EL_VERSION: "8"
        PHP_STREAM: "8.2"
        BORG_SOURCE: epel
    image: directadmin-borg-plugin-test:alma8

  # Opt-in, not in the default matrix: no EL repository carries borg 1.4, so
  # installing it means pip and a build toolchain, which is not how anyone runs
  # it in production. Kept for the day EPEL moves to 1.4, and worth running
  # before upgrading a server past what EPEL ships.
  #
  #   test/docker-test.sh alma9-borg14
  alma9-borg14:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.el
      args:
        EL_VERSION: "9"
        PHP_STREAM: "8.2"
        BORG_SOURCE: pip
        BORG_VERSION: "1.4.5"
    image: directadmin-borg-plugin-test:alma9-borg14
