name=Borg Backup
author=Recranet
version=2.5.0
active=yes
description=Browse and restore from the BorgBackup repository this server already backs up to.

# Plugin code needs root: the repository is root-owned, and a restore has to
# write into /home/<user> (0711) and give files back their original ownership,
# neither of which the `admin` unix account can do. Supported natively since
# DirectAdmin 1.689; replaces the old set-uid wrapper approach.
admin_run_as=root
user_run_as=root

menu_admin=admin/menu.raw
menu_user=user/menu.raw
