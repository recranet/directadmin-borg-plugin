name=Borg Backup
author=Recranet
version=1.0.0
active=yes
description=Manage BorgBackup repositories, schedules and restores from DirectAdmin.

# Plugin code needs root: the source data it backs up (/home/<user> is 0711,
# /etc/shadow, mail spools, /usr/local/directadmin/conf) is unreadable by the
# `admin` unix account, and the repository is root-owned. Supported natively
# since DirectAdmin 1.689; replaces the old set-uid wrapper approach.
admin_run_as=root
user_run_as=root

menu_admin=admin/menu.raw
menu_user=user/menu.raw
