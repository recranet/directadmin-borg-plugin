#!/usr/local/bin/php -n
<?php
/**
 * Admin entry point: /CMD_PLUGINS_ADMIN/borg/
 *
 * The access level comes from this file's location, not from the request:
 * DirectAdmin only ever executes admin/ scripts for admin-level accounts.
 */

declare(strict_types=1);

require_once dirname(__DIR__) . '/bootstrap.php';

use Recranet\DirectAdminBorg\Http\PluginRequest;
use Recranet\DirectAdminBorg\Plugin;
use Recranet\DirectAdminBorg\Security\CsrfTokenizer;
use Recranet\DirectAdminBorg\Ui\AdminPage;

try {
    $plugin = Plugin::boot(dirname(__DIR__));
    $request = PluginRequest::fromEnvironment(PluginRequest::LEVEL_ADMIN);

    echo (new AdminPage($plugin, $request, new CsrfTokenizer($plugin->paths, $plugin->filesystem())))->render();
} catch (Throwable $e) {
    // DirectAdmin discards stderr, so an error has to reach stdout to be seen.
    echo '<div style="padding:12px;border:1px solid #c0392b;border-radius:6px;color:#c0392b">'
        . '<strong>Borg plugin error:</strong> '
        . htmlspecialchars($e->getMessage(), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8')
        . '</div>';
}
